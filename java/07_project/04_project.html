<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
body {
    background-color: #212121;
    color: #fff;
    font-family: arial;
}
* {
    box-sizing: border-box;
}
div#wrapper {
    text-align: center;
}
.number-box {
    background-color: #313131;
    padding: 30px;
    max-width: 500px;
    margin: 0 auto;
    display: block;
    border-radius: 10px;
}

.number-box label {
    display: block;
    font-size: 20px;
    margin: 0 0 10px;
}

.number-box input#guessField {
    padding: 10px;
    font-size: 16px;
    border-radius: 10px;
    margin: 0 0 20px;
    width: 100%;
    border: 2px solid #afafaf;
}

input#subt {
    background-color: #000;
    padding: 10px 40px;
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
}
button#newGame {
    background-color: green;
    color: #fff;
    font-size: 16px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

    </style>   
</head>
<body>
    <div id="wrapper">
        <h1>Number guessing game</h1>
        <div class="number-box">
            <p>Try and guess a random number between 1 to 100.</p>
            <p>You have 10 attempts to guess the right number</p>
            <br/>
            <form action="" class="form">
                <label for="guessField" id="guess">Guess a Number</label>
                <input type="text" id="guessField" class="guessField"/>
                <input type="submit" value="Submit" id="subt" class="guessSubmit"/>
            </form>
            <div class="resultPars">
                <p>Previous Guess: <span class="guesses"></span></p>
                <p>Guesses Remaining: <span class="lastResult">10</span></p>
                <p class="loworHi"></p>
            </div>
        </div>
    </div>
</body>
<script>
let randomNumber = parseInt(Math.random() * 100 + 1);
const submit = document.querySelector("#subt");
const userInput = document.querySelector("#guessField");
const guessSlot = document.querySelector(".guesses");
const remaining = document.querySelector(".lastResult");
const loworHi = document.querySelector(".loworHi");
const startOver = document.querySelector(".resultPars");

const p = document.createElement("p")
let prevGuess = [];
let numGuess = 1;
let playGame = true;

if (playGame) {
    submit.addEventListener("click", function(e){
        e.preventDefault();
        const guess = parseInt(userInput.value);
        console.log(guess);
        validateGuess(guess);
    });
}
function validateGuess(guess){
    if (isNaN(guess)) {
        alert("Please enter a valid Number");
    } else if(guess < 1){
        alert("Please enter a Number more than 1");
    }
    else if(guess > 100){
        alert("Please enter a Number less than 100");
    }else{
        prevGuess.push(guess);
        if (numGuess === 10) {
            displayGuess(guess);
            displayMessage(`Game over, Random number was ${randomNumber}`);
            endGame();
        }else{
            displayGuess(guess);
            checkGuess(guess);
        }
    }
}

function checkGuess(guess){
    if (guess === randomNumber) {
        displayMessage(`You guessed it right`);
        endGame();
    }else if (guess < randomNumber) {
        displayMessage(`Number is Tooo low`);
    }else if (guess > randomNumber) {
        displayMessage(`Number is Tooo high`);
    }
}

function displayGuess(guess){
    userInput.value = ""
    guessSlot.innerHTML += `${guess}, `;
    numGuess++
    remaining.innerHTML = `${10 - numGuess}`
}

function displayMessage(message){
    loworHi.innerHTML = `<h3>${message}</h3>`
}

function endGame(){
    userInput.value = "";
    userInput.setAttribute('disabled', '');
    p.classList.add("button");
    p.innerHTML = `<button id="newGame">Start New Game</button>`;
    startOver.appendChild(p);
    playGame = false;
    newGame();
}
function newGame(){
    const newGameButton = document.querySelector("#newGame");
    newGameButton.addEventListener("click", function(){
        userInput.value = "";
        prevGuess = [];
        numGuess = 1 ;
        guessSlot.innerHTML = "";
        remaining.innerHTML = `${11 - numGuess}`;
        randomNumber = parseInt(Math.random() * 100 + 1);
        userInput.removeAttribute("disabled");
        startOver.removeChild(p);
        displayMessage(``);
        playGame = true;
    })
    

}

</script>
</html>
