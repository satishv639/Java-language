<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
    background-color: #212121;
    color: #fff;
}
    </style>
</head>
<body>
<div class="container">
    <h1>BMI Calculator</h1>
    <form action="">
        <p><label for="">Height in CM:</label><input type="text" id="height"></p>
        <p><label for="">Weight in KG:</label><input type="text" id="weight"></p>
        <button>Calculate</button>
        <div id="result"></div>
        <div id="weight-guide">
            <h3>BMI Weight Guide</h3>
            <p>Under Weight = Less than 18.6</p>
            <p>Normal Range = 18.6 and 24.9</p>
            <p>Overweight = Greater than 24.9</p>
        </div>
    </form>
</div>
</body>
<script>
    const form = document.querySelector("form")
    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const height = parseInt(document.querySelector("#height").value) 
        const weight = parseInt(document.querySelector("#weight").value) 
        const result = document.querySelector("#result")
        if (height === "" || height < 0 || isNaN(height)) {
            result.innerHTML = `Please give a valid height ${height}`
        }else if (weight === "" || weight < 0 || isNaN(weight)) {
            result.innerHTML = `Please give a valid weight ${weight}`
        }else{
            const bmi = (weight / ((height * height) / 10000)).toFixed(2)
            result.innerHTML = `<span>${bmi}</span>`

            if (bmi <= 18.6) {
                const alrtMsg = document.createElement("div")
                alrtMsg.innerHTML = "You are Under Weight = Less than 18.6"
                document.querySelector("#result").appendChild(alrtMsg)
            }
        }
    })
</script>
</html>
