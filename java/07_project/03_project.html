<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
    background-color: #212121;
    color: #fff;
}
.center {
    text-align: center;
}
div#clock {
    background-color: orange;
    width: 100%;
    max-width: 230px;
    margin: 0 auto;
    border-radius: 50px;
    color: #000;
    font-size: 20px;
    padding: 15px 10px;
    margin-top: 10px;
}
    </style>    
</head>
<body>
<div class="center">
    <div id="banner">
        <span>Your local time</span>
    </div>
    <div id="clock"></div>
</div>    
</body>
<script>
const clock = document.getElementById("clock")

setInterval(function(){
    let date = new Date()
    // console.log(date.toLocaleTimeString());
    clock.innerHTML = date.toLocaleTimeString();
}, 1000)

</script>
</html>
