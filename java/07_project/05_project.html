<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Check</title>
    <style>
        body {
            background-color: #212121;
            color: #fff;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        div#insert {
            display: flex;
            align-items: center;
            text-align: center;
            justify-content: center;
            height: 100%;
        }

        .project {
            height: 100%;
        }
        th {
            border: 1px solid;
        }

        td {
            border: 1px solid;
        }

        table {border-collapse: collapse;}
    </style>
</head>
<body>
   <div class="project">
    <div id="insert">
        <div class="key">Press the key and watch magic</div>
    </div>
   </div> 
</body>
<script>
    const insert = document.getElementById("insert");
    window.addEventListener("keydown", (e) => {
        insert.innerHTML = `
        <div class="key">
            <table>
                <tr>
                    <th>Key</th>
                    <th>Keycode</th>
                    <th>Code</th>
                </tr>
                <tr>
                    <td>${e.key === ' ' ? 'Space' : e.key}</td>
                    <td>${e.keyCode}</td>
                    <td>${e.code}</td>
                </tr>

                </table>
        </div>
        `
    })
</script>
</html>
